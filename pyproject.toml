[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anssi-cve"
version = "1.0.0"
description = "Collect CERT-FR (ANSSI) bulletins and enrich their CVEs with MITRE and FIRST EPSS data"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Sharusan Rasakaran" }]
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.5"]

[project.scripts]
anssi-cve = "anssi_cve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
